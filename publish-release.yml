name: publish-release

# APK ko GitHub Release par daalta hai, jisse ek PUBLIC direct download link ban jata hai:
#   https://github.com/skoofficialll-hash/MERCY-GX-V.2/releases/latest/download/MercyGX.apk
# Us link par login nahi chahiye — site ka download button isi par jayega.
#
# Chalane ka tarika: Actions -> publish-release -> Run workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then echo "::error::project zip nahi mila"; exit 1; fi
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          P=$(dirname "$(find _src -maxdepth 4 -name settings.gradle | head -n 1)")
          echo "PROJECT=$P" >> "$GITHUB_ENV"
          echo "project: $P"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK + checksum
        run: |
          set -e
          mkdir -p out
          APK=$(find "$PROJECT" -path "*outputs/apk/debug/*.apk" | head -n 1)
          cp "$APK" out/MercyGX.apk
          cd out
          sha256sum MercyGX.apk > MercyGX.apk.sha256
          ls -lh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.0
          name: Mercy GX 0.9.0 — Android browser
          body: |
            **Mercy GX 0.9.0** — self-updating Android browser.

            - Real browsing (Android WebView / Chromium)
            - Address bar, back / forward / reload, home
            - Bookmarks, history, downloads
            - Gamehub new tab with 5 offline games
            - No ads, no tracking, no account — data stays on your device
            - **New in 0.9.0:** in-app updates (menu → Check for updates)

            **Install:** download `MercyGX.apk` below → open it → allow "install unknown apps" → Install.
            Android 7.0 (API 24) or newer.

            Debug build (self-signed) — Play Protect may show a warning, tap "Install anyway".
          files: |
            out/MercyGX.apk
            out/MercyGX.apk.sha256
          draft: false
          prerelease: false
