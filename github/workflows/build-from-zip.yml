name: build-apk-from-zip

# GitHub zip ko extract nahi karta — isliye ye workflow khud zip kholta hai
# aur uske andar se Android project build karke APK deta hai.
#
# Kaise use kare:
#   1. repo mein zip upload karo (root mein, koi bhi naam)
#   2. ye file add karo: .github/workflows/build-from-zip.yml
#   3. Actions tab -> build-apk-from-zip -> Run workflow
#   4. Artifacts -> MercyGX-apk -> download -> phone par install

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::Repo mein koi .zip nahi mila. Zip root mein upload karo."
            exit 1
          fi
          echo "found zip: $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          SETTINGS=$(find _src -maxdepth 4 -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Zip ke andar settings.gradle nahi mila — galat zip?"
            exit 1
          fi
          PROJECT=$(dirname "$SETTINGS")
          echo "project dir: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Show what we are building
        run: |
          echo "building: $PROJECT"
          ls -la "$PROJECT"
          grep -n "applicationId" "$PROJECT/app/build.gradle" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -e
          cd "$PROJECT"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          APK=$(find "$PROJECT" -path "*outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Build chala par APK nahi mila."
            find "$PROJECT" -name "*.apk" || true
            exit 1
          fi
          cp "$APK" out/MercyGX.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MercyGX-apk
          path: out/MercyGX.apk
          if-no-files-found: error
