name: make-keystore

# Run this ONCE. It creates the signing key your app will use forever.
# Download the artifact, keep it somewhere safe, then add the four secrets
# listed at the bottom of this run's summary. Losing this file means users
# can never update the app without uninstalling it first.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the key
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          PASS_STORE="${STORE_PASS:-$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)}"
          PASS_KEY="${KEY_PASS:-$PASS_STORE}"
          keytool -genkeypair -v \
            -keystore mercy-release.jks \
            -alias mercy \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS_STORE" -keypass "$PASS_KEY" \
            -dname "CN=Sk Inventor, OU=Mercy GX, O=Sk Inventor, L=India, C=IN"
          echo "STORE_PASS=$PASS_STORE" >> "$GITHUB_ENV"
          echo "KEY_PASS=$PASS_KEY" >> "$GITHUB_ENV"
          base64 -w 0 mercy-release.jks > keystore.b64

      - name: Upload the keystore
        uses: actions/upload-artifact@v4
        with:
          name: mercy-release-keystore
          path: keystore.b64
          retention-days: 1

      - name: What to do next
        run: |
          {
            echo "## Keystore created"
            echo ""
            echo "1. Download the artifact **mercy-release-keystore** and keep it private."
            echo "2. Add these repository secrets (Settings -> Secrets and variables -> Actions):"
            echo ""
            echo "| Secret | Value |"
            echo "|---|---|"
            echo "| KEYSTORE_BASE64 | contents of keystore.b64 |"
            echo "| KEYSTORE_PASSWORD | \`$STORE_PASS\` |"
            echo "| KEY_ALIAS | \`mercy\` |"
            echo "| KEY_PASSWORD | \`$KEY_PASS\` |"
            echo ""
            echo "3. Run **release-build** to produce a signed APK and AAB."
          } >> "$GITHUB_STEP_SUMMARY"
