name: release-build

# Builds the signed release APK + AAB for both browsers and publishes them as a
# GitHub release. Needs the four signing secrets added once by make-keystore.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: lite
            zip: mercy_lite.zip
            project: mercy-lite
            apk: MercyLite
            pkg: com.skinventor.mercygx
          - app: pro
            zip: mercy_pro.zip
            project: mercy-pro
            apk: MercyPro
            pkg: com.skinventor.mercypro
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the sources
        run: |
          set -e
          mkdir -p _src && unzip -q -o "${{ matrix.zip }}" -d _src
          test -f "_src/${{ matrix.project }}/app/build.gradle"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate the Android SDK
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "::error::No Android SDK on this runner"
            exit 1
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms" | tail -3

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is missing. Run make-keystore first and add the four secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mercy-release.jks"
          ls -l "$RUNNER_TEMP/mercy-release.jks"

      - name: Build signed release
        working-directory: _src/${{ matrix.project }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/mercy-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleRelease bundleRelease
          VERSION=$(grep -o 'versionName "[^"]*"' app/build.gradle | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "APK=$APK"
          cp "$APK" "../../${{ matrix.apk }}-${VERSION}.apk"
          cp "$AAB" "../../${{ matrix.apk }}-${VERSION}.aab"

      - name: Verify the signature
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "using build-tools $BT"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs \
            "${{ matrix.apk }}-${VERSION}.apk"
          sha256sum "${{ matrix.apk }}-${VERSION}.apk" > "${{ matrix.apk }}-${VERSION}.apk.sha256"
          cat "${{ matrix.apk }}-${VERSION}.apk.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ matrix.app }}
          name: "Mercy ${{ matrix.app }} ${{ env.VERSION }}"
          body: |
            Signed release build.
            Version: ${{ env.VERSION }}
            Package: ${{ matrix.pkg }}
          files: |
            ${{ matrix.apk }}-${{ env.VERSION }}.apk
            ${{ matrix.apk }}-${{ env.VERSION }}.apk.sha256
            ${{ matrix.apk }}-${{ env.VERSION }}.aab
