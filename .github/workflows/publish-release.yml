
name: publish-release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q -o mercy_gx_android.zip -d src
          echo "PROJECT=$(dirname $(find src -maxdepth 4 -name settings.gradle | head -1))" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: cd "$PROJECT" && gradle assembleDebug --no-daemon
      - run: |
          mkdir -p out
          cp "$PROJECT"/app/build/outputs/apk/debug/app-debug.apk out/MercyGX.apk
      - name: publish apk to pages
        run: |
          cp out/MercyGX.apk ./MercyGX.apk
          git config user.name "actions"
          git config user.email "actions@users.noreply.github.com"
          git add MercyGX.apk
          git diff --cached --quiet || (git commit -m "publish apk" && git push)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Mercy GX 1.0.0
          files: out/MercyGX.apk
          
