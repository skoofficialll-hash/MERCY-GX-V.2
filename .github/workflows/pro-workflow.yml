name: build-gecko

# Mercy Pro — GeckoView (Firefox engine) browser.
# Repo layout:  mercy_pro.zip  +  .github/workflows/build-gecko.yml
# Actions -> build-gecko -> Run workflow
#
# The GeckoView version is resolved from Mozilla's Maven at build time, so this
# workflow keeps working when Mozilla ships a new engine.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mercy_pro.zip'
      - '.github/workflows/pro-workflow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gecko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          set -e
          # fixed name on purpose: a repo may hold more than one project zip
          ZIP="mercy_pro.zip"
          if [ ! -f "$ZIP" ]; then echo "::error::mercy_pro.zip repo root mein nahi mila"; exit 1; fi
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          P=$(dirname "$(find _src -maxdepth 4 -name settings.gradle | head -n 1)")
          echo "PROJECT=$P" >> "$GITHUB_ENV"
          echo "project: $P"

      - name: Resolve the newest GeckoView version
        run: |
          set -e
          META=https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml
          # newest engine that still builds against compileSdk 35 (newer ones need
          # compileSdk 37 + AGP 9.1, which is not stable yet)
          VER=$(curl -fsSL "$META" | grep -o '<version>[^<]*' | sed 's/<version>//' \
                | awk -F. '$1<=135' | tail -n 1)
          if [ -z "$VER" ]; then echo "::error::GeckoView version resolve nahi hua"; exit 1; fi
          echo "GeckoView: $VER"
          sed -i "s/GECKOVIEW_VERSION/$VER/" "$PROJECT/app/build.gradle"
          grep -n geckoview "$PROJECT/app/build.gradle"

      - name: Clean duplicate resources
        run: |
          set -e
          # a stray vector drawable with the same name as the PNG icon breaks the
          # resource merger; drop it so any project zip builds cleanly
          find "$PROJECT/app/src/main/res" -name "ic_launcher_foreground.xml" -print -delete || true
          ls "$PROJECT/app/src/main/res/drawable"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build GeckoView APK
        run: cd "$PROJECT" && gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          APK=$(find "$PROJECT" -path "*outputs/apk/debug/*.apk" | head -n 1)
          cp "$APK" out/MercyPro.apk
          cd out && sha256sum MercyPro.apk > MercyPro.apk.sha256
          ls -lh
          echo "MB: $(( $(stat -c%s MercyPro.apk) / 1048576 ))"

      - uses: actions/upload-artifact@v4
        with:
          name: MercyPro-apk
          path: out/MercyPro.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pro-latest
          name: Mercy Pro — latest build
          body: |
            **Mercy Pro** — the big build, for phones with 4 GB RAM or more.

            - Engine: **GeckoView** (the engine Firefox for Android uses)
            - Tabs, engine-level content blocking, history
            - arm64 only, so the download stays manageable
            - For low-end phones use **Mercy Lite** instead
          files: |
            out/MercyPro.apk
            out/MercyPro.apk.sha256

